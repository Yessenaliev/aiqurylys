<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет AIQurylys — тестовый образец</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#15181e; --muted:#667085; --line:#e3e3df; --soft:#efefeb; --acc:#15181e; --accInk:#fff; --mark:#e8590c; --markSoft:#fdebdd; --blue:#1f4e96; --blueSoft:#e7eefa; --ok:#0f7a4d; --okSoft:#e4f4ec; --shadow:0 10px 30px rgba(0,0,0,.12); }
  :root[data-theme="dark"] { --bg:#101319; --card:#171b23; --ink:#eef0f4; --muted:#9aa3b2; --line:#2a303b; --soft:#1e232d; --acc:#eef0f4; --accInk:#101319; --markSoft:#3a2316; --blue:#8db4f0; --blueSoft:#1d2a42; --okSoft:#14301f; --shadow:0 10px 30px rgba(0,0,0,.5); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--bg); }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:inherit; }
  .banner { background:var(--ink); color:var(--bg); font-size:13px; padding:8px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .banner b { color:#ffb48a; }
  .roles { display:flex; gap:5px; flex-wrap:wrap; }
  .roles button { border:1px solid rgba(255,255,255,.3); background:transparent; color:var(--bg); border-radius:14px; padding:2px 11px; font-size:13px; }
  .roles button.on { background:#ffb48a; border-color:#ffb48a; color:#15181e; font-weight:700; }
  .shell { height:calc(100% - var(--bh, 70px)); }
  .app { display:grid; grid-template-columns:248px 1fr; grid-template-rows:56px 1fr; height:100%; }
  .top { grid-column:1/3; display:flex; align-items:center; gap:10px; padding:0 16px; background:var(--card); border-bottom:1px solid var(--line); position:relative; z-index:20; }
  .logo { font-weight:800; font-size:17px; letter-spacing:-.02em; margin-right:6px; text-decoration:none; }
  .logo i { font-style:normal; color:var(--mark); }
  .ask { flex:1; max-width:560px; display:flex; align-items:center; gap:10px; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--muted); text-align:left; }
  .ask kbd { margin-left:auto; font:12px Consolas,monospace; border:1px solid var(--line); border-radius:5px; padding:1px 6px; background:var(--card); }
  .btn { display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-weight:600; text-decoration:none; }
  .btn.pri { background:var(--acc); color:var(--accInk); border-color:var(--acc); }
  .btn.mark { background:var(--mark); color:#fff; border-color:var(--mark); }
  .icon { width:38px; height:38px; justify-content:center; padding:0; position:relative; }
  .dot { position:absolute; top:5px; right:5px; min-width:16px; height:16px; border-radius:8px; background:var(--mark); color:#fff; font-size:11px; line-height:16px; text-align:center; padding:0 4px; }
  .burger { display:none; }
  .side { background:var(--card); border-right:1px solid var(--line); padding:12px; overflow-y:auto; display:flex; flex-direction:column; }
  .side .grp { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:16px 8px 6px; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:9px; text-decoration:none; font-weight:500; }
  .nav:hover { background:var(--soft); }
  .nav.on { background:var(--acc); color:var(--accInk); }
  .nav small { font-size:11px; color:var(--muted); }
  .nav.on small { color:inherit; opacity:.7; }
  .tariff { margin-top:auto; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:13px; background:var(--soft); }
  .tariff .bar { height:6px; background:var(--line); border-radius:4px; margin:8px 0; overflow:hidden; }
  main { overflow-y:auto; padding:26px 30px 90px; }
  .crumbs { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .crumbs a { color:var(--blue); text-decoration:none; } .crumbs a:hover { text-decoration:underline; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.01em; }
  h2 { font-size:17px; margin:0 0 10px; }
  .lead { color:var(--muted); margin:0 0 16px; max-width:720px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:14px 0 20px; flex-wrap:wrap; }
  .tab { padding:9px 14px; border:0; background:none; border-bottom:2px solid transparent; color:var(--muted); font-weight:600; text-decoration:none; margin-bottom:-1px; }
  .tab:hover { color:var(--ink); }
  .tab.on { color:var(--ink); border-bottom-color:var(--mark); }
  .grid { display:grid; gap:14px; }
  .g4 { grid-template-columns:repeat(4,1fr); } .g2 { grid-template-columns:1.5fr 1fr; } .g3 { grid-template-columns:repeat(3,1fr); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  a.card { display:block; text-decoration:none; } a.card:hover { border-color:var(--ink); }
  .kpi b { display:block; font-size:28px; letter-spacing:-.02em; }
  .kpi span { font-size:13px; color:var(--muted); }
  .empty { text-align:center; padding:22px 10px; color:var(--muted); }
  .quick { display:grid; gap:6px; }
  .quick a { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; text-decoration:none; background:var(--card); }
  .quick a:hover { border-color:var(--ink); }
  .quick small { display:block; color:var(--muted); font-size:12px; }
  .chip { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:6px; background:var(--blueSoft); color:var(--blue); }
  .chip.o { background:var(--markSoft); color:var(--mark); } .chip.g { background:var(--okSoft); color:var(--ok); }
  .path { list-style:none; margin:0; padding:0; counter-reset:s; display:grid; gap:8px; }
  .path li a { display:flex; gap:12px; align-items:center; padding:11px 13px; border:1px solid var(--line); border-radius:11px; text-decoration:none; background:var(--card); }
  .path li a:hover { border-color:var(--ink); }
  .path li a::before { counter-increment:s; content:counter(s); width:26px; height:26px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; }
  .path li.done a::before { content:"✓"; background:var(--okSoft); color:var(--ok); }
  .path small { display:block; color:var(--muted); font-size:12px; }
  .flow { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:10px; align-items:stretch; }
  .flow > div { border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--card); }
  .flow small { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .flow .ar { border:0; padding:0; display:flex; align-items:center; color:var(--muted); font-size:20px; background:none; }
  .flow .nx a { display:block; color:var(--blue); font-weight:600; text-decoration:none; margin:2px 0; } .flow .nx a:hover { text-decoration:underline; }
  .docs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .docs a { border:1px solid var(--line); border-radius:12px; padding:12px; text-decoration:none; background:var(--card); }
  .docs a:hover { border-color:var(--ink); }
  .docs b { display:block; margin-bottom:2px; } .docs span { font-size:13px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .list { margin:0; padding-left:18px; } .list li { margin:3px 0; }
  .nextbar { position:sticky; bottom:-70px; margin-top:20px; background:var(--card); border:1px solid var(--ink); border-radius:14px; padding:12px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; box-shadow:var(--shadow); }
  .nextbar span { color:var(--muted); font-size:13px; }
  .pop { position:absolute; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:8px; min-width:250px; z-index:40; display:none; max-height:78vh; overflow:auto; }
  .pop.open { display:block; }
  .pop .ph { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 10px 4px; }
  .pop a, .pop button.it { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:8px; border:0; background:none; text-decoration:none; }
  .pop a:hover, .pop button.it:hover { background:var(--soft); }
  .pop small { display:block; color:var(--muted); font-size:12px; }
  .create-pop { width:min(720px, 92vw); columns:2; column-gap:6px; }
  .create-pop .col { break-inside:avoid; }
  .overlay { position:fixed; inset:0; background:rgba(10,12,16,.5); display:none; align-items:flex-start; justify-content:center; padding-top:12vh; z-index:60; }
  .overlay.open { display:flex; }
  .palette { width:min(640px, 94vw); background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .palette input { width:100%; border:0; border-bottom:1px solid var(--line); padding:16px 18px; font:inherit; font-size:17px; background:transparent; color:var(--ink); outline:none; }
  .palette .res { max-height:52vh; overflow:auto; padding:6px; }
  .palette .res a { display:flex; justify-content:space-between; gap:12px; padding:9px 12px; border-radius:9px; text-decoration:none; }
  .palette .res a.sel, .palette .res a:hover { background:var(--soft); }
  .palette .res small { color:var(--muted); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; z-index:80; display:none; max-width:90vw; }
  .toast.on { display:block; }
  @media (max-width:900px) {
    .app { grid-template-columns:1fr; }
    .side { position:fixed; left:0; top:130px; bottom:0; width:270px; z-index:30; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow); }
    .side.open { transform:none; }
    .burger { display:inline-flex; }
    .g4 { grid-template-columns:1fr 1fr; } .g2, .g3 { grid-template-columns:1fr; } .docs { grid-template-columns:1fr 1fr; }
    .flow { grid-template-columns:1fr; } .flow .ar { display:none; }
    main { padding:18px 16px 90px; } .ask span.t { display:none; } .create-pop { columns:1; }
    .hide-m { display:none; }
  }
</style>
</head>
<body>
<div class="banner" id="banner"><a href="index.html#roles" style="color:#ffb48a;font-weight:700;text-decoration:none">← На сайт</a><span><b>Тестовый образец.</b> Выберите, кем вы работаете:</span><div class="roles" id="roles"></div><span id="rnote" style="font-size:12px;opacity:.8"></span></div>

</div></div>

      h += '<a class="nav' + (cur && cur.s.id === s.id ? ' on' : '') + '" href="#/' + s.id + '/' + tabsOf(s)[0].id + '"><span>' + esc(s.t) + '</span>' + (n > 1 ? '<small>' + n + '</small>' : '') + '</a>';
    });
    if (ROLES[role].company) h += '<div class="tariff"><b>Расчётов в пакете 0/1</b><div class="bar"></div>Пробный доступ 0 %<br><a class="btn pri" style="margin-top:8px" href="#/company/tariff">Подключить тариф</a></div>';
    $('side').innerHTML = h;
  }

  // ----- Меню «Создать», профиль, помощь -----
  function popCreate() {
    var h = '';
    CREATE.forEach(function (g) {
      var items = g[1].filter(function (i) { return can(i[2]); });
      if (!items.length) return;
      h += '<div class="col"><div class="ph">' + esc(g[0]) + '</div>';
      items.forEach(function (i) { h += '<a href="#/' + i[3] + '" data-close>' + esc(i[0]) + '<small>' + esc(i[1]) + '</small></a>'; });
      h += '</div>';
    });
    $('createPop').innerHTML = h;
  }
  function popOthers() {
    $('bellPop').innerHTML = '<div class="ph">Уведомления</div><div class="empty" style="padding:14px">Новых уведомлений нет</div><a href="' + BASE + '/settings?tab=notifications" target="_blank" rel="noopener">Настроить уведомления ↗</a>';
    $('helpPop').innerHTML = '<div class="ph">Помощь</div><a href="#/home/today" data-close>С чего начать<small>Ваш путь по шагам — на главной</small></a><a href="' + BASE + '/handbook" target="_blank" rel="noopener">Как пользоваться AIQurylys ↗<small>Статьи, словарь, чек-листы и курсы по ролям</small></a><a href="' + BASE + '/handbook" target="_blank" rel="noopener">Мне нужен АОСР ↗</a><a href="' + BASE + '/handbook" target="_blank" rel="noopener">Что нужно для тендера? ↗</a>';
    $('profPop').innerHTML = '<div class="ph">' + esc(ROLES[role].n) + ' · Yessenaliev</div>' +
      '<a href="' + BASE + '/settings" target="_blank" rel="noopener">Профиль и вход ↗<small>Имя, почта, пароль</small></a>' +
      '<a href="' + BASE + '/settings?tab=notifications" target="_blank" rel="noopener">Уведомления ↗</a>' +
      '<a href="' + BASE + '/support" target="_blank" rel="noopener">Поддержка ↗<small>Новое обращение и мои обращения — одна страница</small></a>' +
      '<a href="https://t.me/AIQurylys_Bot" target="_blank" rel="noopener">Telegram-бот ↗<small>Задачи и отчёты с телефона</small></a>' +
      '<button class="it" id="themeBtn">Тема: ' + (document.documentElement.dataset.theme === 'dark' ? 'ночь' : 'день') + '</button>' +
      '<button class="it" data-toast="Язык: в образце переключение не работает">Язык: Рус / Қаз</button>' +
      '<button class="it" data-toast="Выход в образце отключён">Выйти</button>';
    $('themeBtn').onclick = function () { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? '' : 'dark'; popOthers(); };
  }

  // ----- Экраны -----
  function rl(r) { var f = find(r); return f ? f : null; }
  function nextLinks(t) {
    return (t.next || []).filter(function (n) { return rl(n[0]); });
  }

  function view(r) {
    var cur = find(r) || find('home/today');
    var s = cur.s, t = cur.t, route = s.id + '/' + t.id;
    mark(route);
    renderSide(cur);
    document.title = (s.id === 'home' && t.id === 'today' ? 'Главная' : t.t + (s.id === 'home' ? '' : ' — ' + s.t)) + ' — AIQurylys';
    var first = tabsOf(s)[0];
    var h = '<div class="crumbs"><a href="#/home/today">Кабинет</a>' + (s.id === 'home' ? '' : ' / <a href="#/' + s.id + '/' + first.id + '">' + esc(s.t) + '</a>') + ' / ' + esc(t.t) + '</div><h1>' + esc(s.id === 'home' ? 'Главная' : t.t) + '</h1>';
    var ts = tabsOf(s);
    if (ts.length > 1) h += '<div class="tabs">' + ts.map(function (x) { return '<a class="tab' + (x.id === t.id ? ' on' : '') + '" href="#/' + s.id + '/' + x.id + '">' + esc(x.t) + '</a>'; }).join('') + '</div>';
    if (t.home) h += home();
    else {
      h += '<p class="lead">' + esc(t.d) + '</p>';
      var nx = nextLinks(t);
      h += '<div class="flow"><div><small>Вы даёте</small>' + esc(t.give) + '</div><div class="ar">→</div><div><small>Получаете</small>' + esc(t.get) + '</div><div class="ar">→</div><div class="nx"><small>Дальше</small>' + (nx.length ? nx.map(function (n) { return '<a href="#/' + n[0] + '">' + esc(n[1]) + ' →</a>'; }).join('') : '—') + '</div></div>';
      h += '<div class="grid g2" style="margin-top:14px"><div class="card">';
      if (t.docs) h += '<h2>Выберите вид документа</h2><div class="docs">' + DOCS.map(function (d) { return '<a href="' + BASE + d[2] + '" target="_blank" rel="noopener"><b>' + esc(d[0]) + ' ↗</b><span>' + esc(d[1]) + '</span></a>'; }).join('') + '</div>';
      else if (t.access) h += '<h2>Доступ по должностям</h2><p class="lead" style="margin-bottom:8px">Раньше этот список был внизу страницы «Ещё». Деньги компании и сотрудников видит только владелец.</p><table><tr><th>Должность</th><th>Видит</th></tr>' + ACCESS.map(function (a) { return '<tr><td><b>' + esc(a[0]) + '</b></td><td>' + esc(a[1]) + '</td></tr>'; }).join('') + '</table><p style="margin-top:12px"><a class="btn" href="' + BASE + '/team" target="_blank" rel="noopener">Приглашения и должности ↗</a> <a class="btn" href="' + BASE + '/settings?tab=menu" target="_blank" rel="noopener">Список разделов ↗</a></p>';
      else h += '<h2>Рабочий экран</h2><p>Здесь открывается рабочая страница «' + esc(t.t) + '» действующего кабинета: те же поля, кнопки и результаты. В образце показано, где она теперь находится и куда ведёт дальше.</p><p><a class="btn mark" href="' + BASE + t.url + '" target="_blank" rel="noopener">Открыть в рабочей версии ↗</a>' + (t.url2 ? ' <a class="btn" href="' + BASE + t.url2 + '" target="_blank" rel="noopener">Улучшить план ↗</a>' : '') + '</p>';
      h += '</div><div><div class="card"><h2>Где это было раньше</h2><p style="margin:0">' + esc(t.was) + '</p></div>';
      var sib = ts.filter(function (x) { return x.id !== t.id; });
      if (sib.length) h += '<div class="card" style="margin-top:14px"><h2>В этом же разделе</h2><ul class="list">' + sib.map(function (x) { return '<li><a href="#/' + s.id + '/' + x.id + '">' + esc(x.t) + '</a></li>'; }).join('') + '</ul></div>';
      h += '</div></div>';
      // Нить: шаг в «пути» роли и следующий шаг
      var path = ROLES[role].path, idx = -1;
      path.forEach(function (p, i) { if (p[0] === route && idx < 0) idx = i; });
      var target = null, label = '';
      if (idx >= 0 && idx < path.length - 1) { target = path[idx + 1]; label = 'Шаг ' + (idx + 2) + ' вашего пути: ' + target[1]; }
      else if (nx.length) { target = [nx[0][0]]; label = nx[0][1]; }
      if (target && rl(target[0])) h += '<div class="nextbar"><span>' + (idx >= 0 ? 'Вы на шаге ' + (idx + 1) + ' из ' + path.length + ' вашего пути' : 'Следующий шаг') + '</span><a class="btn pri" href="#/' + target[0] + '">' + esc(label) + ' →</a><a class="btn" href="#/home/today">К началу пути</a></div>';
      else h += '<div class="nextbar"><span>Путь пройден</span><a class="btn pri" href="#/home/today">На главную</a></div>';
    }
    $('main').innerHTML = h;
    $('main').scrollTop = 0;
  }

  function home() {
    var R = ROLES[role];
    var q = QUICK.filter(function (x) { return can(x[3]); }).slice(0, 6);
    var h = '<p class="lead"><b>' + esc(R.n) + '.</b> ' + esc(R.line) + '</p>';
    h += '<div class="grid g4"><a class="card kpi" href="#/projects/list"><b>0</b><span>Проектов в работе</span></a><a class="card kpi" href="#/tasks/mine"><b>0</b><span>Задач в работе</span></a>' +
      (can('documents') ? '<a class="card kpi" href="#/docs/made"><b>0</b><span>Документов за 30 дней</span></a>' : '<a class="card kpi" href="#/tasks/mine"><b>0</b><span>Моих отчётов</span></a>') +
      '<a class="card kpi" href="#/' + (can('summary') ? 'home/summary' : 'tasks/mine') + '"><b>0</b><span>Требует решений</span></a></div>';
    h += '<div class="grid g2" style="margin-top:14px"><div><div class="card"><h2>С чего начать: ваш путь</h2><ol class="path">' +
      R.path.map(function (p) { var ok = rl(p[0]); return ok ? '<li class="' + (seen(p[0]) ? 'done' : '') + '"><a href="#/' + p[0] + '"><span>' + esc(p[1]) + '<small>' + esc(p[2]) + '</small></span></a></li>' : ''; }).join('') + '</ol>';
    if (role === 'foreman') h += '<p style="margin:12px 0 0;font-size:13px;color:var(--muted)">Основная работа идёт в Telegram: <a href="https://t.me/AIQurylys_Bot" target="_blank" rel="noopener">@AIQurylys_Bot ↗</a>, вход по коду от руководителя.</p>';
    h += '</div>' +
      '<div class="card" style="margin-top:14px"><h2>Требует решения</h2><span class="chip g">Срочных вопросов нет</span></div></div>' +
      '<div><div class="card"><h2>Быстрые действия</h2><div class="quick">' + q.map(function (x) { return '<a href="#/' + x[2] + '"><span><b>' + esc(x[0]) + '</b><small>' + esc(x[1]) + '</small></span></a>'; }).join('') + '</div><p style="margin:10px 0 0;font-size:13px;color:var(--muted)">Остальное — «＋ Создать» или поиск.</p></div>' +
      '<div class="card" style="margin-top:14px"><h2>Проекты</h2><div class="empty">Проектов пока нет<br><a class="btn pri" style="margin-top:10px" href="#/projects/list">Новый проект</a></div></div></div></div>';
    return h;
  }

  // ----- Всплывающие окна и поиск -----
  function closePops() { ['createPop','bellPop','helpPop','profPop'].forEach(function (i) { $(i).classList.remove('open'); }); }
  function toggle(id) { var o = $(id).classList.contains('open'); closePops(); if (!o) { if (id === 'createPop') popCreate(); popOthers(); $(id).classList.add('open'); } }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 2200); }

  var palSel = 0;
  function palIndex() {
    var out = [];
    CREATE.forEach(function (g) { g[1].forEach(function (i) { if (can(i[2])) out.push({ t: i[0], s: g[0] + ' · ' + i[1], r: i[3] }); }); });
    secs().forEach(function (s) { tabsOf(s).forEach(function (t) { out.push({ t: s.t + ' → ' + t.t, s: t.d || 'Главная страница', r: s.id + '/' + t.id }); }); });
    return out;
  }
  function palRender() {
    var q = $('palIn').value.trim().toLowerCase();
    var all = palIndex();
    var items = (q ? all.filter(function (x) { return (x.t + ' ' + x.s).toLowerCase().indexOf(q) !== -1; }) : all.slice(0, 8)).slice(0, 9);
    var h = items.map(function (x, i) { return '<a href="#/' + x.r + '" data-close class="' + (i === palSel ? 'sel' : '') + '"><span>' + esc(x.t) + '</span><small>' + esc(x.s).slice(0, 58) + '</small></a>'; }).join('');
    if (q) h += '<a href="#" data-ask class="' + (palSel === items.length ? 'sel' : '') + '"><span>🤖 Спросить AIQurylys: «' + esc($('palIn').value.trim()) + '»</span><small>один вход вместо трёх</small></a>';
    $('palRes').innerHTML = h || '<div class="empty">Ничего не найдено</div>';
  }
  function palOpen() { $('pal').classList.add('open'); $('palIn').value = ''; palSel = 0; palRender(); setTimeout(function () { $('palIn').focus(); }, 30); }
  function palClose() { $('pal').classList.remove('open'); }

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closePops(); palClose(); $('side').classList.remove('open'); }
    if (e.target.closest('[data-ask]')) { e.preventDefault(); palClose(); toast('В рабочей версии здесь отвечает помощник AIQurylys'); }
    var tt = e.target.closest('[data-toast]'); if (tt) toast(tt.getAttribute('data-toast'));
    if (!e.target.closest('.pop') && !e.target.closest('.top .btn')) closePops();
    if (e.target === $('pal')) palClose();
  });
  $('side').addEventListener('click', function () { $('side').classList.remove('open'); });
  $('burger').onclick = function (e) { e.stopPropagation(); $('side').classList.toggle('open'); };
  $('askBtn').onclick = palOpen;
  $('createBtn').onclick = function (e) { e.stopPropagation(); toggle('createPop'); };
  $('bellBtn').onclick = function (e) { e.stopPropagation(); toggle('bellPop'); };
  $('helpBtn').onclick = function (e) { e.stopPropagation(); toggle('helpPop'); };
  $('profBtn').onclick = function (e) { e.stopPropagation(); toggle('profPop'); };
  $('palIn').addEventListener('input', function () { palSel = 0; palRender(); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palOpen(); return; }
    if (!$('pal').classList.contains('open')) { if (e.key === 'Escape') closePops(); return; }
    var n = $('palRes').querySelectorAll('a').length;
    if (e.key === 'Escape') palClose();
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(n - 1, palSel + 1); palRender(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palRender(); }
    if (e.key === 'Enter') { var a = $('palRes').querySelectorAll('a')[palSel]; if (a) a.click(); }
  });

  // ----- Роль и маршрут -----
  function setRole(k) {
    role = k;
    [].forEach.call($('roles').children, function (b) { b.classList.toggle('on', b.dataset.k === k); });
    $('avatar').textContent = ROLES[k].n[0];
    $('rnote').textContent = ROLES[k].note || '';
    popCreate(); popOthers();
    var r = location.hash.replace(/^#\//, '');
    if (r === 'home/today' || !find(r)) { if (location.hash !== '#/home/today') location.hash = '#/home/today'; else route(); } else route();
  }
  ORDER.forEach(function (k) { var b = document.createElement('button'); b.textContent = ROLES[k].n; b.dataset.k = k; b.onclick = function () { setRole(k); }; $('roles').appendChild(b); });
  function route() { view(location.hash.replace(/^#\//, '')); }
  function fit() { $('shell').style.setProperty('--bh', $('banner').offsetHeight + 'px'); }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', route);
  // для проверки ссылок
  window.__aq = { roles: ORDER, setRole: setRole, find: function (r, k) { var o = role; role = k; var f = !!find(r); role = o; return f; }, hrefs: function () { return [].map.call(document.querySelectorAll('a[href^="#/"]'), function (a) { return a.getAttribute('href').slice(2); }); } };
  var qr = '';
  try { qr = new URLSearchParams(location.search).get('role') || ''; } catch (e) {}
  fit(); setRole(ROLES[qr] ? qr : 'director');
})();
</script>
</body>
</html>
